name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: Modern-YT-Downloader
            asset_name: Modern-YT-Downloader-Linux
          - os: windows-latest
            artifact_name: Modern-YT-Downloader.exe
            asset_name: Modern-YT-Downloader-Win.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
          Get-ChildItem -Path ffmpeg_temp -Filter ffmpeg.exe -Recurse | Copy-Item -Destination .
          Get-ChildItem -Path ffmpeg_temp -Filter ffprobe.exe -Recurse | Copy-Item -Destination .
          Remove-Item -Recurse -Force ffmpeg_temp, ffmpeg.zip

      - name: Build with PyInstaller (Using Spec File)
        run: uv run pyinstaller build.spec --clean

      - name: Rename artifact for identification
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv dist/Modern-YT-Downloader.exe dist/${{ matrix.asset_name }}
          else
            mv dist/Modern-YT-Downloader dist/${{ matrix.asset_name }}
          fi

      - name: Build Windows Installer with Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Rename back so the .iss script can find it
          Move-Item dist\${{ matrix.asset_name }} dist\Modern-YT-Downloader.exe
          # Compile installer (Inno Setup is pre-installed on windows-latest runners)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          # Rename portable exe back for upload
          Move-Item dist\Modern-YT-Downloader.exe dist\${{ matrix.asset_name }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Modern-YT-Downloader-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
